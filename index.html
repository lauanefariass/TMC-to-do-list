<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>To-Do List</title>
</head>

<body>
    <div class="main-container">
        <div>
            <h1 class="title">To-Do List</h1>
            <p class="subtitle">Welcome to the best website to help you be productive</p>
        </div>

        <div class="container d-flex justify-content-center gap-2 mb-3">
            <div class="input-search">
                <input type="text" id="search-input" placeholder="Search...">
                <img src="./image/search.svg" alt="Search">
            </div>
            <button class="btn">All</button>
            <button class="btn">
                <img src="./image/moon.svg" alt="Toggle theme">
            </button>
        </div>

        <div class="todo-items"></div>

        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">+</button>

        <!-- Modal for Adding a Task -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <p class="modal-title">New Note</p>
                        <input type="text" class="todo-input" />
                        <div class="footer-btn">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary" id="apply-btn">Apply</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal for Editing a Task -->
        <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <p class="modal-title">Edit Note</p>
                        <input type="text" class="todo-input-edit" />
                        <div class="footer-btn">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary" id="edit-btn">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="./index.js"></script>
    </div>
</body>

</html>
